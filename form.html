<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style2.css">
  <title>Dating Profile Form</title>
</head>
<body>
  <div class="form-container">
    <h2>Create Your Dating Profile</h2>
    <form action="valentine.html" method="get">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="18" max="99" required>

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">-- Select --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="nonbinary">Non-binary</option>
        <option value="other">Other</option>
      </select>

      <label for="interests">Interests</label>
      <input type="text" id="interests" name="interests" placeholder="e.g., hiking, music, travel">

      <label for="bio">Short Bio</label>
      <textarea id="bio" name="bio" rows="4" placeholder="Tell us something about yourself..."></textarea>

      <button type="submit">Submit Profile</button>
    </form>
  </div>
</body>
</html>
